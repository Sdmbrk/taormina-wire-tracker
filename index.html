<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taormina Village-01 · Wire Issue Tracker v2.3.2</title>
<style>
.voice-card{margin:0 0 14px;padding:12px;border:1px dashed #94a3b8;border-radius:12px;background:#f8fafc}
.voice-card .voice-row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:6px}
.voice-txt{width:100%;margin-top:8px}
.voice-res{margin-top:10px;padding-top:10px;border-top:1px solid #e2e8f0}
.voice-res .voice-row{margin-top:4px}
:root{
  --teal:#0d9488;--teal-d:#0f766e;--teal-l:#ccfbf1;--navy:#0f2747;--navy-2:#1e3a5f;
  --ink:#14213d;--muted:#64748b;--line:#e2e8f0;--bg:#f1f7f7;
  --amber:#d97706;--amber-l:#fef3c7;--green:#15803d;--green-l:#dcfce7;--red:#dc2626;--red-l:#fee2e2;
  --shadow:0 1px 2px rgba(15,39,71,.05),0 12px 30px -14px rgba(15,39,71,.22);
}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);
  background:radial-gradient(1100px 420px at 8% -12%,#bff0ea,transparent 60%),var(--bg);font-size:14px;-webkit-font-smoothing:antialiased}
header{background:linear-gradient(120deg,var(--navy) 0%,var(--navy-2) 55%,var(--teal-d) 100%);color:#fff;padding:18px 24px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;box-shadow:0 10px 30px -12px rgba(15,39,71,.6)}
.brand{display:flex;align-items:center;gap:14px}
.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#5eead4,#0d9488);display:grid;place-items:center;font-weight:800;color:var(--navy);box-shadow:inset 0 -3px 0 rgba(0,0,0,.12)}
header h1{font-size:17px;margin:0;font-weight:700;letter-spacing:.2px}
header p{margin:3px 0 0;font-size:12px;opacity:.75}
.ver{font-size:12px;font-weight:700;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);padding:5px 12px;border-radius:999px}
nav{position:sticky;top:0;z-index:5;background:rgba(255,255,255,.86);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:6px;overflow-x:auto}
nav button{font:inherit;font-weight:600;border:0;background:transparent;padding:9px 16px;border-radius:999px;cursor:pointer;color:var(--muted);white-space:nowrap;transition:all .15s}
nav button:hover{color:var(--teal-d);background:var(--teal-l)}
nav button.on{background:linear-gradient(135deg,var(--teal),var(--teal-d));color:#fff;box-shadow:0 8px 18px -8px rgba(13,148,136,.8)}
main{max-width:1280px;margin:0 auto;padding:22px 16px 40px}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:22px;margin-bottom:20px}
.card-h{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.card-h h2{font-size:17px;margin:2px 0 0;color:var(--navy)}
.eyebrow{font-size:11px;letter-spacing:.9px;text-transform:uppercase;color:var(--teal-d);font-weight:700}
.hint{font-size:12px;color:var(--muted);margin:6px 0 0;line-height:1.5}
.grid-chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font:inherit;font-weight:600;font-size:13px;border:1px solid #cfe3e1;background:#fff;color:var(--navy);padding:9px 15px;border-radius:999px;cursor:pointer;transition:all .15s}
.chip:hover{border-color:var(--teal);color:var(--teal-d);transform:translateY(-1px)}
.chip.on{background:linear-gradient(135deg,var(--teal),var(--teal-d));border-color:transparent;color:#fff;box-shadow:0 8px 18px -8px rgba(13,148,136,.85)}
.chip.sm{padding:6px 12px;font-size:12px}
.chip.vt-ok,.chip.on.vt-ok{background:#16a34a;border-color:#15803d;color:#fff;box-shadow:0 6px 14px -8px rgba(22,163,74,.9)}
.chip.vt-pos,.chip.on.vt-pos{background:#ea580c;border-color:#c2410c;color:#fff;box-shadow:0 6px 14px -8px rgba(234,88,12,.9)}
.chip.vt-over,.chip.on.vt-over{background:#dc2626;border-color:#991b1b;color:#fff;box-shadow:0 6px 14px -8px rgba(220,38,38,.9)}
.chip.tone-ok{background:#dcfce7;border-color:#16a34a;color:#15803d}
.chip.tone-pos{background:#ffedd5;border-color:#ea580c;color:#c2410c}
.chip.tone-over{background:#fee2e2;border-color:#dc2626;color:#991b1b}
.chip.on.tone-ok{background:#16a34a;border-color:transparent;color:#fff;box-shadow:0 8px 18px -8px rgba(22,163,74,.85)}
.chip.on.tone-pos{background:#ea580c;border-color:transparent;color:#fff;box-shadow:0 8px 18px -8px rgba(234,88,12,.85)}
.chip.on.tone-over{background:#dc2626;border-color:transparent;color:#fff;box-shadow:0 8px 18px -8px rgba(220,38,38,.85)}
.seg{display:inline-flex;background:#eef5f5;border-radius:16px;padding:5px;gap:4px;flex-wrap:wrap}
.seg button{font:inherit;font-weight:700;border:0;background:transparent;padding:11px 18px;border-radius:12px;cursor:pointer;color:var(--muted);display:flex;align-items:center;gap:9px;transition:all .15s}
.seg button.on{background:#fff;color:var(--navy);box-shadow:0 4px 12px -4px rgba(15,39,71,.3)}
.dot{width:11px;height:11px;border-radius:50%;display:inline-block;flex:none}
.stepper{display:inline-flex;align-items:center;background:#f7fbfb;border:1px solid #cfe3e1;border-radius:16px;padding:5px;gap:2px}
.stepper button{width:36px;height:36px;border-radius:12px;border:0;background:#fff;color:var(--teal-d);font-size:20px;font-weight:700;cursor:pointer;box-shadow:0 1px 3px rgba(15,39,71,.12);transition:all .12s;line-height:1}
.stepper button:hover{background:var(--teal);color:#fff}
.stepper input{width:82px;border:0;background:transparent;text-align:center;font:inherit;font-weight:800;font-size:16px;color:var(--navy);outline:none;-moz-appearance:textfield}
.stepper input::-webkit-outer-spin-button,.stepper input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.stepper .u{font-size:12px;color:var(--muted);padding:0 10px 0 4px;font-weight:700}
.stepper.sm button{width:30px;height:30px;font-size:17px;border-radius:10px}
.stepper.sm input{width:56px;font-size:14px}
input.txt,select.txt,textarea.txt{font:inherit;border:1px solid #cfe3e1;border-radius:12px;padding:10px 13px;background:#fff;color:var(--ink);outline:none;min-width:0;width:100%}
input.txt:focus,textarea.txt:focus{border-color:var(--teal);box-shadow:0 0 0 4px rgba(13,148,136,.15)}
textarea.txt{min-height:120px;font-family:ui-monospace,Consolas,monospace;font-size:12px;resize:vertical}
.field{display:flex;flex-direction:column;gap:7px;font-size:12px;font-weight:700;color:var(--muted)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px 22px}
.step{display:flex;align-items:center;gap:9px;font-weight:700;color:var(--navy);font-size:13px;margin-bottom:10px}
.step b{width:24px;height:24px;border-radius:50%;background:var(--teal-l);color:var(--teal-d);display:grid;place-items:center;font-size:12px}
.sec{margin-bottom:20px}
.btn{font:inherit;font-weight:700;border:0;padding:11px 20px;border-radius:13px;cursor:pointer;transition:transform .12s,box-shadow .12s,background .12s;font-size:14px}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,var(--teal),var(--teal-d));color:#fff;box-shadow:0 12px 22px -12px rgba(13,148,136,.95)}
.btn.ghost{background:#fff;color:var(--teal-d);border:1px solid #cfe3e1}
.btn.danger{background:#fff;color:var(--red);border:1px solid #fecaca;padding:8px 14px;font-size:13px}
.btn.arm{background:var(--red);color:#fff;border:1px solid var(--red);padding:8px 14px;font-size:13px}
.btn.sm{padding:8px 14px;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px;margin-bottom:20px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c,var(--teal))}
.k-v{font-size:26px;font-weight:800;color:var(--navy);letter-spacing:-.4px}
.k-l{font-size:12px;color:var(--muted);font-weight:600;margin-top:3px}
.bar{height:9px;background:#e6f0f0;border-radius:99px;overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#34d399);border-radius:99px}
.table-wrap{overflow-x:auto;border-radius:16px;border:1px solid var(--line)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
th{background:#f4faf9;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.6px;font-weight:700;text-align:left;padding:12px 14px;white-space:nowrap;border-bottom:1px solid var(--line)}
td{padding:11px 14px;border-bottom:1px solid #eef3f3;white-space:nowrap}
tbody tr:hover td{background:#f9fcfc}
tr:last-child td{border-bottom:0}
td.num,th.num{text-align:right;font-variant-numeric:tabular-nums}
td a{color:var(--teal-d);font-weight:700;text-decoration:none;cursor:pointer}
td a:hover{text-decoration:underline}
tr.total td{background:linear-gradient(90deg,#e6f7f5,#f4fbfb);font-weight:800;color:var(--navy)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.p-pos{background:#ffedd5;color:#c2410c}
.p-ok{background:#dcfce7;color:#15803d}
.p-over{background:var(--red-l);color:#991b1b}
.p-neutral{background:#eef2f7;color:var(--muted)}
.p-teal{background:var(--teal-l);color:var(--teal-d)}
.blocks-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px}
.bcard{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:18px;display:flex;flex-direction:column;gap:14px;transition:transform .15s,box-shadow .15s}
.bcard:hover{transform:translateY(-2px);box-shadow:0 18px 36px -16px rgba(15,39,71,.3)}
.bcard-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.th-name{font:inherit;font-size:18px;font-weight:800;color:var(--navy);border:1px solid transparent;border-radius:10px;padding:4px 8px;background:transparent;width:150px;outline:none}
.th-name:hover{border-color:#cfe3e1}
.th-name:focus{border-color:var(--teal);background:#fff}
.trow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mini{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mini div{background:linear-gradient(180deg,#f7fcfb,#eef8f6);border:1px solid #e0f0ed;border-radius:14px;padding:10px 6px;text-align:center}
.mini b{display:block;font-size:16px;color:var(--navy);font-variant-numeric:tabular-nums}
.mini small{font-size:11px;color:var(--muted);font-weight:700;letter-spacing:.3px}
.cfoot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;gap:8px;flex-wrap:wrap}
.icards{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:8px}
.icard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;gap:4px}
.icard-h{display:flex;align-items:center;justify-content:space-between;gap:6px;flex-wrap:wrap}
.icard-h b{font-size:14px;color:var(--navy)}
.icard-h .pill{padding:2px 9px;font-size:11px}
.ivil{display:flex;flex-direction:column;gap:2px}
.irow{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;font-size:12px;border-top:1px dashed var(--line);padding-top:3px}
.irow .vn{font-weight:700;color:var(--navy);min-width:48px}
.isz{display:flex;flex-wrap:wrap;gap:2px 8px;color:var(--muted);font-variant-numeric:tabular-nums}
.isz b{color:var(--navy)}
.wlog{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:6px}
.wrow{background:#fff;border:1px solid var(--line);border-radius:12px;padding:6px 9px;display:flex;flex-direction:column;gap:3px}
.wrow-top{display:flex;flex-wrap:wrap;align-items:center;gap:4px 6px;font-size:12px}
.wrow-top .pill{padding:2px 8px;font-size:11px}
.wrow-top .wv{color:var(--navy);font-size:12px}
.wrow-top .wc{display:inline-flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.wrow-top .wq{margin-left:auto;color:var(--navy);font-variant-numeric:tabular-nums}
.wrow-bot{display:flex;align-items:center;justify-content:space-between;gap:6px}
.wrow-bot .note{font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.wrow-bot .btn{padding:3px 9px;font-size:11px;flex-shrink:0}
.wtotal{grid-column:1/-1;display:flex;justify-content:space-between;padding:8px 10px;border-radius:12px;background:var(--teal-l);color:var(--teal-d);font-size:13px}
.wlog{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:5px}
.wdate{grid-column:1/-1;font-size:11px;font-weight:700;letter-spacing:.4px;color:var(--muted);margin-top:4px}
.wg{background:#fff;border:1px solid var(--line);border-radius:10px;padding:5px 7px;display:flex;flex-direction:column;gap:4px}
.wg-h{display:flex;align-items:center;flex-wrap:wrap;gap:3px 5px;font-size:12px}
.wg-h .pill{padding:1px 7px;font-size:10px}
.wg-h .wv{color:var(--navy)}
.wg-h .wq{margin-left:auto;color:var(--navy);font-variant-numeric:tabular-nums}
.wg-e{display:flex;flex-wrap:nowrap;justify-content:space-between;gap:2px;min-width:0;overflow:hidden}
.went{display:inline-flex;align-items:center;gap:2px;font-size:11px;min-width:0}
.went .core{width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;line-height:1;font-size:8px;padding:0;margin:0;text-align:center;flex-shrink:0}
.went .btn{min-height:0;padding:0 1px;margin:0;border:0;background:none;box-shadow:none;color:#dc2626;font-size:12px;line-height:1}
.wtotal{grid-column:1/-1;display:flex;justify-content:space-between;padding:6px 10px;border-radius:10px;background:var(--teal-l);color:var(--teal-d);font-size:13px}
.otiles{display:flex;justify-content:space-between;gap:4px;flex-wrap:nowrap}
.otile{display:flex;flex-direction:column;align-items:center;gap:3px;flex:1;min-width:0}
.otile b{font-size:15px;color:var(--navy);font-variant-numeric:tabular-nums}
.otile b.neg{color:#dc2626}
.otile .note{font-size:10px;text-align:center}
.otile .core{width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;padding:0;font-size:9px;line-height:1}
.wi-sz{display:flex;flex-direction:column;gap:6px;padding:8px 0;border-top:1px dashed var(--line)}
.wi-h{display:flex;align-items:center;gap:8px;font-size:13px}
.wi-cs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.wi-c{display:flex;flex-direction:column;align-items:center;gap:4px}
.wi-c .core{width:24px;height:24px;display:inline-flex;align-items:center;justify-content:center;padding:0;font-size:9px;line-height:1}
.wi-in{padding:6px 4px;text-align:center;font-size:14px}
.wi-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.ov-size{padding:5px 14px;font-size:16px;font-weight:800;letter-spacing:.2px}
.vbtns{display:flex;flex-wrap:nowrap;gap:8px}
.vbtn{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border-radius:16px;border:1px solid #cfe3e1;background:#fff;cursor:pointer;font:inherit;color:var(--navy);box-shadow:var(--shadow)}
.vbtn b{font-size:20px;color:var(--vc);font-variant-numeric:tabular-nums;line-height:1.1}
.vbtn span{font-size:11px;font-weight:700;color:var(--muted);text-align:center;white-space:nowrap}
.vbtn.on{border-color:var(--vc);box-shadow:0 0 0 2px var(--vc) inset}
.wdate-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.wdate-row .btn{padding:3px 12px;font-size:12px}
.wo-edit{width:64px;padding:3px 5px;font-size:13px;text-align:center}
.del-row{display:inline-flex;align-items:center;gap:4px;flex-wrap:wrap}
.del-row .del-in{width:120px;padding:4px 8px;font-size:12px}
.del-row .btn{padding:4px 10px;font-size:12px;min-height:0}
.undobar{display:flex;gap:8px;justify-content:flex-end;margin:0 0 10px}
.undobar .btn:disabled{opacity:.45;cursor:default}
.preview{margin-top:18px;padding:16px;border-radius:18px;background:linear-gradient(135deg,#f0fbf9,#f7fafc);border:1px dashed #9fdcd5}
.mixrow{display:flex;flex-wrap:wrap;gap:6px}
details{margin-top:6px}
summary{cursor:pointer;font-weight:700;color:var(--teal-d);padding:6px 0;outline:none}
.empty{text-align:center;color:var(--muted);padding:28px;font-size:13px}
.note{font-size:12px;color:var(--muted);line-height:1.6}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(10px);background:var(--navy);color:#fff;padding:12px 20px;border-radius:999px;opacity:0;transition:all .25s;pointer-events:none;font-size:13px;font-weight:600;max-width:90vw;box-shadow:0 14px 30px -10px rgba(15,39,71,.6);z-index:20}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.bad{background:var(--red)}
footer{text-align:center;font-size:11px;color:var(--muted);padding:18px;letter-spacing:.3px}
footer b{color:var(--teal-d)}
.export-row{display:flex;gap:10px;flex-wrap:wrap;margin:4px 0 20px}
.export-row .btn{min-width:180px}
@media (max-width:720px){
  header{padding:14px 16px}
  header h1{font-size:15px}
  header p{display:none}
  .logo{width:36px;height:36px;border-radius:11px}
  nav{padding:8px 10px}
  nav button{padding:8px 13px;font-size:13px}
  main{padding:14px 10px 40px}
  .card{padding:16px;border-radius:16px;margin-bottom:14px}
  .card-h{margin-bottom:12px}
  .card-h h2{font-size:15px}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}
  .kpi{padding:14px}
  .k-v{font-size:19px}
  .form-grid{grid-template-columns:1fr;gap:14px}
  .blocks-grid{grid-template-columns:1fr;gap:14px}
  .seg{display:flex;width:100%}
  .seg button{flex:1;justify-content:center;padding:12px 10px;font-size:13px}
  .chip{padding:10px 14px;min-height:40px}
  .chip.sm{min-height:38px;padding:9px 13px}
  .stepper button{width:44px;height:44px;font-size:22px}
  .stepper input{width:70px;font-size:17px}
  .stepper.sm button{width:38px;height:38px}
  input.txt,select.txt,textarea.txt{font-size:16px;padding:12px}
  .btn{padding:13px 18px;min-height:46px}
  .btn.danger,.btn.arm{min-height:40px;padding:9px 14px}
  .export-row .btn{width:100%;min-width:0}
  .mini b{font-size:14px}
  .mini div{padding:9px 4px}
  .th-name{width:120px;font-size:16px}
  td,th{padding:8px 9px;font-size:12px}
  .table-wrap{border-radius:12px}
  td:first-child,th:first-child{position:sticky;left:0;z-index:1;background:#fff}
  th:first-child{background:#f4faf9}
  tbody tr:hover td:first-child{background:#f9fcfc}
  .toast{bottom:14px;font-size:12px;white-space:normal;width:90vw;text-align:center;border-radius:14px}
  .bcard{padding:14px}
  .preview{padding:12px}
}

.th-grid{display:grid;gap:12px}
.th-card{border:1px solid #e0f0ed;border-radius:16px;background:#fff;overflow:hidden}
.th-head{width:100%;font:inherit;border:0;background:linear-gradient(180deg,#f7fcfb,#eef8f6);padding:14px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;cursor:pointer;text-align:left;color:var(--navy)}
.th-head b{font-size:16px}
.th-body{padding:8px 12px 12px;display:grid;gap:8px}
.vrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;border-radius:12px;background:#f8fbfb;border:1px solid #e6f1ef}
.vtype{font-weight:700;color:var(--navy);font-size:13px}
.vsz{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums;flex:1;min-width:150px}
.cores{display:inline-flex;gap:3px;flex-wrap:wrap;vertical-align:middle}

  { v: '2.3.2', d: '2026-11-15', t: 'Reset all entries now clears every wire in and wire out entry, every stock request and every change request, so old notifications no longer come back. Users, blocks, villa types and requirements are kept. The backup is still downloaded first.' },
  { v: '2.3.1', d: '2026-11-15', t: 'The signed-in name and role now show in the top bar on phones too. On narrow screens the role is hidden and a long name is shortened, so the name stays visible next to Alerts and Log out.' },
  { v: '2.3.0', d: '2026-11-14', t: 'Google sign-in. The admin adds each person\'s Gmail address under Access control (also when adding a user). On the sign-in screen, Sign in with Google signs the person in when that address is registered, and they get their existing role. Unregistered Google accounts are turned away. Password sign-in still works.' },
  { v: '2.2.0', d: '2026-11-14', t: 'Voice entry: on Wire in and Wire Out, tap Speak and say, for example, "stock in 2.5 red 10 yellow 5, 4 blue 3" or "stock out 2.5 red 10 black 4 to Ahmed". The words are shown as a result with each size, colour and roll count, and can be corrected before you use them. Stock in opens the preview, and nothing is saved until the storekeeper confirms. Stock out fills the Wire Out form, then you choose TH and villas and press Preview. Voice works in Chrome, Edge, Samsung Internet and Safari (iPhone); other browsers can type the words. Trial tab (admin): send sample alerts to your devices, and view the app as another user (read only).' },

  { v: '2.1.1', d: '2026-11-14', t: 'Delete confirmations now name the exact entry: each wire in and wire out row shows its number (#), date, delivery note and rolls, and the Type DELETE prompt repeats them. Wire in rows without a delivery note are labelled "no delivery note". Pending change cards show the same details.' },
  { v: '2.1.0', d: '2026-11-14', t: 'Rich notifications. With alerts turned on (the Enable alerts button in the header), your phone or computer shows a notification even when the app is closed. Foreman gets each wire in and wire out with TH, villa, size, colour and rolls. Storekeeper gets each stock-out request. Admin gets change requests. The person who asked is told when a stock-out or change is accepted, rejected or approved. iPhone: first add the app to the Home Screen (iOS 16.4 or later), open it from the icon, then turn on alerts.' },
  { v: '2.0.2', d: '2026-11-14', t: 'Installable app: the page now has a web app manifest, icons and a service worker. Android offers Install app; on iPhone, Add to Home Screen opens it full screen. Live data is never cached.' },

function setMix(mix, t, n) {

    ]);

function importCsv(text) {
  var lines = text.split(/\r?\n/), ok = 0, errs = [];
  lines.forEach(function (line, idx) {
    line = line.trim();
    if (!line) return;
    var p = line.split(',').map(function (x) { return x.trim(); });
    if (p[0].toLowerCase() === 'block') return;
    var name = p[0];
    if (!name) { errs.push('line ' + (idx + 1) + ': no block'); return; }
    var mix = {}, bad = '';
    if (p.length >= 3 && p[1] && p[1].indexOf('=') < 0) {
      if (!typeOf(p[1])) bad = 'unknown type "' + p[1] + '"';
      else mix[p[1]] = Math.max(0, Math.floor(num(p[2])));
    } else if (p[1]) {
      p[1].split(';').forEach(function (pair) {
        var kv = pair.split('=');
        var t = (kv[0] || '').trim();
        if (!typeOf(t)) bad = 'unknown type "' + t + '"';
        else mix[t] = Math.max(0, Math.floor(num(kv[1])));
      });
    }
    if (bad) { errs.push('line ' + (idx + 1) + ': ' + bad); return; }
    var b = blockOf(name);
    if (b) b.mix = mix;
    else S.blocks.push({ block: name, mix: mix });
    ok++;
  });
  save();
  return { ok: ok, errs: errs };
}

function reportCsv() {
  var head = ['Block', 'Villa types', 'Villas'];
  SIZES.forEach(function (sz) { head.push(sz + ' sqmm required (rolls)', sz + ' sqmm issued (rolls)', sz + ' sqmm balance (rolls)'); });
  var lines = [head.join(',')];
  S.blocks.forEach(function (b) {
    var r = [b.block, mixEntries(b).map(function (e) { return e.type + '=' + e.n; }).join(';'), villasIn(b)];
    SIZES.forEach(function (sz) { var q = blockReq(b, sz), s = issued(b.block, sz); r.push(csvNum(q), csvNum(s), csvNum(q - s)); });
    lines.push(r.join(','));
  });
  return lines.join('\n');
}

/* rows: [{block, villa, size, colour, rolls}] -> one card per TH with its villas and colour totals */

    g.sizes[r.size] = g.sizes[r.size] || {};

/* ---------- Voice entry: say stock in / stock out with sizes, colours and rolls ---------- */
var SpeechRec = (typeof window !== 'undefined') && (window.SpeechRecognition || window.webkitSpeechRecognition) || null;
var voiceSt = { in: { text: '', listening: false, note: '' }, out: { text: '', listening: false, note: '' } };
var VOICE_NUM = { zero: 0, one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10, eleven: 11, twelve: 12, thirteen: 13, fourteen: 14, fifteen: 15, sixteen: 16, seventeen: 17, eighteen: 18, nineteen: 19, twenty: 20, thirty: 30, forty: 40, fifty: 50, sixty: 60, seventy: 70, eighty: 80, ninety: 90, hundred: 100 };
var VOICE_COL = { red: 'R', r: 'R', yellow: 'Y', y: 'Y', blue: 'B', b: 'B', black: 'BK', bk: 'BK', green: 'YG', yg: 'YG' };
var VOICE_SKIP = { stock: 1, wire: 1, 'in': 1, out: 1, the: 1, a: 1, of: 1, sqmm: 1, sq: 1, mm: 1, square: 1, millimetre: 1, millimetres: 1, millimeter: 1, millimeters: 1, rolls: 1, roll: 1, qty: 1, quantity: 1, each: 1, and: 1, 'with': 1, is: 1, size: 1, colour: 1, color: 1, please: 1, add: 1, then: 1, also: 1, at: 1, 'sqmm,': 1 };

function voiceNormalise(t) {
  var s = ' ' + String(t || '').toLowerCase().replace(/[,;]+/g, ' ').replace(/\s+/g, ' ') + ' ';
  s = s.replace(/\s(\d+)\s+and\s+a\s+half\b/g, function (m, a) { return ' ' + (Number(a) + 0.5) + ' '; });
  s = s.replace(/\sand\s+a\s+half\b/g, ' .5 ');
  var words = s.split(' ').map(function (w) { return VOICE_NUM[w] !== undefined ? String(VOICE_NUM[w]) : (w === 'point' ? '.' : w); });
  s = ' ' + words.join(' ') + ' ';
  s = s.replace(/(\d)\s*\.\s*(\d)/g, '$1.$2').replace(/\s\.(\d)/g, ' 0.$1');
  s = s.replace(/(\d+(?:\.\d+)?)\s*(sqmm|sq\.?\s*mm|mm)\b/g, '$1 ');
  return s.replace(/\s+/g, ' ').trim();
}

function voiceParse(text, kind) {
  var raw = voiceNormalise(text);
  var mode = /\b(stock|wire) out\b/.test(raw) || / out /.test(' ' + raw + ' ') ? 'out'
    : /\b(stock|wire) in\b/.test(raw) || / in /.test(' ' + raw + ' ') ? 'in' : kind;
  var nm = raw.match(/\b(?:to|for)\s+([a-z][a-z .'-]*?)(?=\s+(?:th|red|yellow|blue|black|green|bk|yg|\d+(?:\.\d+)?)\b|\s*$)/);
  var name = nm ? nm[1].trim().replace(/\b\w/g, function (c) { return c.toUpperCase(); }) : '';
  var body = nm ? raw.replace(nm[0], ' ') : raw;
  var tokens = body.split(' ').filter(Boolean);
  var lines = {}, notes = [], size = null, pc = null, skipNum = false, total = 0;
  var colName = function (c) { var x = CORE_COLORS.filter(function (k) { return k.s === c; })[0]; return x ? x.n : c; };
  for (var i = 0; i < tokens.length; i++) {
    var t = tokens[i];
    if (skipNum && /^\d+(\.\d+)?$/.test(t)) { skipNum = false; continue; }
    if (t === 'th') { skipNum = true; continue; }
    if (t === 'yellow' && tokens[i + 1] === 'green') { pc = 'YG'; i++; continue; }
    if (VOICE_COL[t]) { if (pc) notes.push('no quantity for ' + colName(pc)); pc = VOICE_COL[t]; continue; }
    if (/^\d+(\.\d+)?$/.test(t)) {
      if (pc) {
        var q = Math.round(parseFloat(t) * 2) / 2;
        if (!size) notes.push('no size for ' + colName(pc) + ' ' + t);
        else if (q > 0) { lines[size] = lines[size] || {}; lines[size][pc] = (lines[size][pc] || 0) + q; total += q; }
        pc = null; continue;
      }
      if (SIZES.indexOf(t) >= 0) { size = t; continue; }
      notes.push('number ' + t + ' is not a size (2.5, 4 or 6)'); continue;
    }
    if (VOICE_SKIP[t]) continue;
    var note = 'unclear "' + t + '"';
    if (notes.indexOf(note) < 0) notes.push(note);
  }
  if (pc) notes.push('no quantity for ' + colName(pc));
  return { mode: mode, lines: lines, name: name, notes: notes, total: round2(total) };
}

function voiceListen(kind) {
  var st = voiceSt[kind];
  if (st.listening) return;
  if (!SpeechRec) { toast('Voice is not available in this browser. Type the words instead.', true); return; }
  var rec;
  try { rec = new SpeechRec(); } catch (e) { toast('Voice could not start in this browser. Type the words instead.', true); return; }
  rec.lang = 'en-US'; rec.interimResults = false; rec.maxAlternatives = 1; rec.continuous = false;
  st.listening = true; st.note = ''; render();
  rec.onresult = function (ev) { st.text = ev.results[0][0].transcript; st.listening = false; render(); };
  rec.onerror = function (ev) {
    st.listening = false;
    st.note = ev.error === 'not-allowed' ? 'The microphone is blocked. Allow it in the browser settings, then try again.'
      : ev.error === 'no-speech' ? 'No speech was heard. Tap Speak and try again.'
      : 'Voice stopped (' + ev.error + '). You can type the words instead.';
    render();
  };
  rec.onend = function () { if (st.listening) { st.listening = false; render(); } };
  try { rec.start(); } catch (e) { st.listening = false; st.note = 'Could not start the microphone. Try again.'; render(); }
}

function voiceReset(kind) { voiceSt[kind] = { text: '', listening: false, note: '' }; }

function voiceUseIn(p) {
  var d = wiDraft || (wiDraft = wiNew());
  var lines = {};
  SIZES.forEach(function (sz) { if (p.lines[sz]) lines[sz] = Object.assign({}, p.lines[sz]); });
  pendingIn = { date: d.date || localDate(), ref: (d.ref || '').trim(), remarks: (d.remarks || '').trim(), lines: lines };
  voiceReset('in');
  render();
  window.scrollTo(0, 0);
}

function voiceUseOut(p) {
  draft.sizes = SIZES.filter(function (sz) { return p.lines[sz]; });
  draft.mode = 'custom';
  draft.cr = zeroSizeCr();
  draft.sizes.forEach(function (sz) { CORE_COLORS.forEach(function (c) { if (p.lines[sz][c.s]) draft.cr[sz][c.s] = p.lines[sz][c.s]; }); });
  if (p.name && canRequestOut()) draft.to = p.name;
  voiceReset('out');
  tab = 'issues';
  render();
  toast('Filled from your voice. Choose the TH and villas, then press Preview. Each selected villa gets these rolls.');
}

function voiceResult(kind, p) {
  var rows = SIZES.filter(function (sz) { return p.lines[sz]; }).map(function (sz) {
    var sum = 0;
    CORE_COLORS.forEach(function (c) { sum += p.lines[sz][c.s] || 0; });
    return el('div', { class: 'voice-row' }, [
      sizeDot(sz), el('b', { text: sz + ' sqmm' }),
      el('span', { class: 'note', text: CORE_COLORS.filter(function (c) { return p.lines[sz][c.s]; }).map(function (c) { return c.n + ' ' + fmt(round2(p.lines[sz][c.s])); }).join(' · ') }),
      el('span', { class: 'wq', text: fmt(round2(sum)) + ' rolls' })
    ]);
  });
  var head = el('div', { class: 'voice-row' }, [
    el('span', { class: 'pill ' + (p.mode === 'in' ? 'p-ok' : 'p-over'), text: p.mode === 'in' ? 'Stock in' : 'Stock out' }),
    p.name ? el('b', { text: 'to ' + p.name }) : null,
    el('span', { class: 'wq', text: fmt(p.total) + ' rolls total' })
  ]);
  var notes = p.notes.length ? el('p', { class: 'hint', text: 'Not understood: ' + p.notes.join(' · ') + '. Correct the words above and check again.' }) : null;
  var action = null;
  if (!p.total) action = el('p', { class: 'hint', text: 'Nothing recognised yet. Try: "stock in 2.5 red 10 yellow 5, 4 blue 3".' });
  else if (p.mode === 'in') {
    action = kind === 'in' && canWireIn()
      ? el('button', { class: 'btn primary sm', text: 'Use for stock in and preview', onclick: function () { voiceUseIn(p); } })
      : el('p', { class: 'hint', text: 'Stock in is entered on the Overview page, under Wire in.' });
  } else {
    action = kind === 'out' && (canWriteStore() || canRequestOut())
      ? el('button', { class: 'btn primary sm', text: canRequestOut() ? 'Use for stock-out request' : 'Use for stock out', onclick: function () { voiceUseOut(p); } })
      : el('p', { class: 'hint', text: 'Stock out is entered on the Wire Out tab.' });
  }
  return el('div', { class: 'voice-res' }, [head].concat(rows, [notes, el('div', { class: 'grid-chips', style: 'margin-top:8px' }, [
    action, el('button', { class: 'btn ghost sm', text: 'Clear', onclick: function () { voiceReset(kind); render(); } })
  ])]));
}

function voiceCard(kind) {
  var st = voiceSt[kind];
  var p = st.text.trim() ? voiceParse(st.text, kind) : null;
  return el('div', { class: 'voice-card' }, [
    el('div', { class: 'voice-row' }, [
      el('b', { text: 'Voice entry' }),
      el('span', { class: 'note', text: SpeechRec ? 'Tap Speak, say it, check the result, then confirm.' : 'Voice is not available in this browser. Type the words instead.' })
    ]),
    el('div', { class: 'voice-row' }, [
      el('button', { class: 'btn primary sm', text: st.listening ? 'Listening…' : 'Speak', onclick: function () { voiceListen(kind); } }),
      el('span', { class: 'hint', text: 'Example: ' + (kind === 'in' ? '"stock in 2.5 red 10 yellow 5, 4 blue 3"' : '"stock out 2.5 red 10 black 4 to Ahmed"') })
    ]),
    el('textarea', { class: 'txt voice-txt', rows: '2', placeholder: 'Or type here', onchange: function () { st.text = this.value; render(); } }, [st.text]),
    st.note ? el('p', { class: 'hint', text: st.note }) : null,
    p ? voiceResult(kind, p) : null
  ]);
}

/* ---------- Trial area (admin): test alerts and view the app as another user ---------- */
var VIEW_AS = null;   /* { u, role, real } while viewing as another user; nothing can be saved */
var TEST_ALERTS = [['in', 'Wire in'], ['out', 'Wire out'], ['request', 'Stock-out request'], ['accepted', 'Stock-out accepted'], ['change', 'Change request']];
function sendTestAlert(kind) {
  rpc('wt_test_alert', { p_token: SRV.token, p_kind: kind })
    .then(function (n) { toast(n ? 'Test sent to ' + n + ' device' + (n > 1 ? 's' : '') + '. It should arrive in a few seconds.' : 'This admin has no device with alerts on. Tap Enable alerts in the header first.', !n); })
    .catch(function (e) { toast(e.message || String(e), true); });
}
function startViewAs(u) {
  VIEW_AS = { u: u.username, role: u.role, real: me.role };
  me.role = u.role;
  tab = 'report';
  render();
  toast('Viewing as ' + u.username + '. Read only.');
}
function stopViewAs() {
  if (!VIEW_AS) return;
  me.role = VIEW_AS.real; VIEW_AS = null; tab = 'trial'; render();
}
function viewTrial() {
  var box = el('div');
  if (VIEW_AS) box.appendChild(el('div', { class: 'card notice', 'data-open': '1' }, [
    el('b', { text: 'Viewing as ' + VIEW_AS.u + ' (' + roleName(VIEW_AS.role) + ')' }),
    el('p', { class: 'hint', text: 'Read only: nothing can be saved or changed while you view as another user.' }),
    el('button', { class: 'btn primary sm', text: 'Back to admin', onclick: stopViewAs })
  ]));
  box.appendChild(el('div', { class: 'card', 'data-open': '1' }, [
    el('div', { class: 'card-h' }, [el('div', {}, [el('span', { class: 'eyebrow', text: 'Trial' }), el('h2', { text: 'Check alerts' }),
      el('p', { class: 'hint', text: 'Sends a sample alert to this admin\'s devices, so you can see how each notification looks. Turn on alerts in the header first.' })])]),
    el('div', { class: 'grid-chips' }, TEST_ALERTS.map(function (t) {
      return el('button', { class: 'btn ghost sm', text: t[1], onclick: function () { sendTestAlert(t[0]); } });
    }))
  ]));
  var others = SRV.users.filter(function (x) { return x.username !== me.u; });
  box.appendChild(el('div', { class: 'card', 'data-open': '1' }, [
    el('div', { class: 'card-h' }, [el('div', {}, [el('span', { class: 'eyebrow', text: 'Trial' }), el('h2', { text: 'Act as a user' }),
      el('p', { class: 'hint', text: 'See the app as another user would see it. This is a read-only preview; no data is changed.' })])]),
    others.length ? el('div', { class: 'grid-chips' }, others.map(function (x) {
      return el('button', { class: 'btn ghost sm', text: x.username + ' · ' + roleName(x.role), onclick: function () { startViewAs(x); } });
    })) : el('p', { class: 'hint', text: 'No other users yet. Create users under Access control.' })
  ]));
  return box;
}

function render() {
  var nav = $('nav'), app = $('app'), who = $('who');
  nav.innerHTML = ''; app.innerHTML = ''; who.innerHTML = '';
  if (!SRV.booted) { app.appendChild(el('div', { class: 'empty', text: 'Connecting to the shared store…' })); return; }
  if (!me || !SRV.token) { app.appendChild(viewLogin()); return; }
  who.appendChild(el('span', { class: 'whotxt', title: me.u + ' · ' + roleName(me.role) }, [
    el('span', { class: 'whouser', text: me.u }),
    el('span', { class: 'whorole', text: ' · ' + roleName(me.role) })
  ]));
  var pb = pushButton(); if (pb) who.appendChild(pb);
  if (!pushSynced) { pushSynced = true; syncPush(); }
  who.appendChild(el('button', { class: 'btn ghost sm', text: 'Log out', onclick: logout }));
  var tabs = TABS.filter(function (t) { return permFor(t[0]) !== 'none'; });
  if (!tabs.some(function (t) { return t[0] === tab; })) tab = tabs[0][0];
  tabs.forEach(function (t) {
    var label = t[1] + (t[0] === 'report' && SRV.unseen ? '  ●' + SRV.unseen : '');
    nav.appendChild(el('button', { class: tab === t[0] ? 'on' : null, text: label, onclick: function () { tab = t[0]; render(); } }));
  });
  var v = tab === 'report' ? viewReport() : tab === 'issues' ? viewIssues() : tab === 'blocks' ? viewBlocks() : tab === 'types' ? viewTypes() : tab === 'reports' ? viewReports() : tab === 'access' ? viewAccess() : tab === 'trial' ? viewTrial() : viewData();
  app.appendChild(v);
  if (tab === 'report') SRV.unseen = 0;
  if (permFor(tab) === 'view') lockView(app);
}

$('ver').textContent = 'v' + APP_VERSION;
render();
boot();

</script>
<script>
if ('serviceWorker' in navigator) { window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); }); }
</script>
</body>
